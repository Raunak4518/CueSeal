[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-audio-screening"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "av>=14,<19",
    "cryptography>=44",
    "fastapi>=0.116,<1",
    "numpy>=1.26,<3",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.22,<1",
    "rfc8785>=0.1.4,<1",
    "scipy>=1.12,<2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "scikit-learn>=1.5,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
nmfp = ["onnxruntime>=1.21,<2"]

[project.scripts]
secure-audio = "secure_audio.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["secure_audio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
